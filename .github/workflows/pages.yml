name: Deploy type.ai to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble movie scene image atlas
        run: |
          mkdir -p images
          cat .github/assets/movie-scenes.part*.b64 | base64 --decode > images/movie-scenes-grid.webp
          test -s images/movie-scenes-grid.webp
          rm -rf .github/assets
      - name: AI super-resolution of original movie artwork
        run: |
          python -m pip install --quiet opencv-contrib-python-headless==4.10.0.84 Pillow
          curl -L --fail --retry 3 -o EDSR_x2.pb https://github.com/Saafke/EDSR_Tensorflow/raw/master/models/EDSR_x2.pb
          python - <<'PY'
          import cv2
          import numpy as np
          from PIL import Image

          source = "images/movie-scenes-grid.webp"
          output = "images/movie-scenes-grid.png"
          with Image.open(source) as image:
              image.load()
              rgba = image.convert("RGBA")
              width, height = rgba.size
              if width % 8 or height % 4:
                  raise SystemExit(f"Unexpected 8x4 atlas dimensions: {width}x{height}")
              src = np.asarray(rgba)
              cell_w, cell_h = width // 8, height // 4

              sr = cv2.dnn_superres.DnnSuperResImpl_create()
              sr.readModel("EDSR_x2.pb")
              sr.setModel("edsr", 2)

              enhanced = np.zeros((height * 2, width * 2, 4), dtype=np.uint8)
              for row in range(4):
                  for col in range(8):
                      x1, y1 = col * cell_w, row * cell_h
                      tile = src[y1:y1 + cell_h, x1:x1 + cell_w]
                      bgr = cv2.cvtColor(tile[:, :, :3], cv2.COLOR_RGB2BGR)
                      up_bgr = sr.upsample(bgr)
                      up_rgb = cv2.cvtColor(up_bgr, cv2.COLOR_BGR2RGB)
                      up_alpha = cv2.resize(tile[:, :, 3], (cell_w * 2, cell_h * 2), interpolation=cv2.INTER_CUBIC)
                      oy, ox = row * cell_h * 2, col * cell_w * 2
                      enhanced[oy:oy + cell_h * 2, ox:ox + cell_w * 2, :3] = up_rgb
                      enhanced[oy:oy + cell_h * 2, ox:ox + cell_w * 2, 3] = up_alpha

              Image.fromarray(enhanced, "RGBA").save(output, format="PNG", optimize=True, compress_level=6)
              print(f"EDSR x2 complete: {width}x{height} -> {width*2}x{height*2}; original 32 scene illustrations retained.")
          PY
          test -s images/movie-scenes-grid.png
          rm images/movie-scenes-grid.webp EDSR_x2.pb
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
