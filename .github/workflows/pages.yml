name: Deploy type.ai to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble movie scene image atlas
        run: |
          mkdir -p images
          cat .github/assets/movie-scenes.part*.b64 | base64 --decode > images/movie-scenes-grid.webp
          test -s images/movie-scenes-grid.webp
          rm -rf .github/assets
      - name: Increase atlas resolution without changing artwork
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          source = "images/movie-scenes-grid.webp"
          output = "images/movie-scenes-grid.png"
          with Image.open(source) as image:
              image.load()
              width, height = image.size
              if width % 8 or height % 4:
                  raise SystemExit(f"Unexpected 8x4 atlas dimensions: {width}x{height}")
              enlarged = image.resize((width * 2, height * 2), Image.Resampling.LANCZOS)
              enlarged.save(output, format="PNG", optimize=True, compress_level=6)
              print(f"Kept original scene artwork; upscaled atlas {width}x{height} -> {width*2}x{height*2}")
          PY
          test -s images/movie-scenes-grid.png
          rm images/movie-scenes-grid.webp
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
