lengthBank.ko.news.long = ["한국항공우주산업 노조원들은 서울에서 집회를 열고 한화의 경영 참여에 반대하며 회사의 독립경영 보장과 정부의 분명한 입장 표명을 요구했다.", "강신철 국방부 장관은 주한일본대사와 만나 한반도와 지역 안보 상황을 논의했다. 양측은 국방 교류를 안정적으로 이어가고 현안에 대해 긴밀히 소통하기로 했다.", "한일 경제계는 제33회 한일재계회의에서 통상 환경 변화와 에너지 공급망 불안에 공동 대응하고, 양국의 산업 역량을 결합해 새로운 성장 기회를 찾기로 했다.", "정부는 법정기념일 지정 이후 처음 맞는 한식의 날을 기념해 서울 국립중앙박물관에서 행사를 열었다. 축제에서는 전통 음식 체험과 조리 시연, 식품기업 홍보 프로그램이 진행됐다.", "경제사회노동위원회는 인구구조 변화에 따른 일자리 과제를 논의하기 위해 시민 100명과 숙의토론회를 진행한다. 논의 결과는 향후 정책 실행 방안을 만드는 데 활용될 예정이다.", "한국과 중국의 전문가들은 한반도 평화와 안정을 위해 양국 간 전략적 소통을 강화할 필요가 있다고 밝혔다. 참석자들은 긴장 완화와 경제 협력, 인적 교류 확대의 중요성도 논의했다.", "KAI 노조는 한화의 경영 참여가 회사의 독립성과 의사결정에 영향을 줄 수 있다고 우려하며 정부가 명확한 입장을 내고 독립경영을 보장해야 한다고 촉구했다.", "양국 국방 관계자는 한반도 주변의 안보 상황을 점검하고 실무 교류를 꾸준히 이어갈 방안을 논의했다. 대화는 현안이 생길 때 긴밀하게 소통하자는 데 초점을 맞췄다.", "한국경제인협회와 일본경제단체연합회는 산업 공급망의 불확실성과 인구 감소 같은 공통 과제에 함께 대응하고, 양국 기업의 강점을 바탕으로 새로운 시장을 개척하겠다는 뜻을 모았다.", "한식의 날을 맞아 열린 축제에는 전통 음식과 식재료를 소개하는 부스가 마련됐다. 방문객들은 조리 시연과 쿠킹클래스에 참여하며 한식의 문화적 가치와 산업적 가능성을 살펴봤다.", "시민회의에서는 상생 일자리와 평생 일자리 분야의 핵심 과제를 중심으로 구체적인 실행 방법을 논의한다. 제안된 방안은 다음 단계의 사회적 대화와 정책 검토에 참고 자료로 쓰일 계획이다.", "한중 전략대화에 참여한 전문가들은 국제 정세가 복잡해질수록 양국의 의사소통이 중요하다고 강조했다. 경제 협력과 인적 교류를 확대하는 일도 지역 안정에 도움이 될 수 있다고 봤다.", "집회 참가자들은 KAI의 독립경영을 보장하고 경영 참여 문제에 대한 정부 입장을 분명히 해 달라고 요구했다. 노조는 회사의 미래와 의사결정 구조에 영향을 미칠 수 있다는 점을 문제로 제기했다.", "한국과 일본의 국방 당국은 지역 안보에 관한 의견을 나누고 기존 교류를 안정적으로 이어가기로 했다. 양측은 다양한 현안이 생길 때마다 실무 차원의 소통을 이어가기로 했다.", "한일재계회의에 참석한 기업인들은 공급망 변화에 대응하려면 양국 기업의 강점을 결합해야 한다고 강조했다. 공동 성명에는 새 시장과 산업을 개척하고 공통 과제에 함께 대응하겠다는 방향이 담겼다.", "한식대축제는 음식의 맛뿐 아니라 전통과 생활문화의 가치도 알리는 행사로 마련됐다. 현장에서는 전통 음식 체험과 식품기업 홍보, 조리 시연이 진행돼 시민과 외국인 관람객의 참여를 이끌었다.", "인구 변화와 일자리 문제를 다루는 시민회의는 일자리 정책을 구체적인 실행 방안으로 발전시키는 데 목적이 있다. 참가자들은 여러 관점을 나누고 지속 가능한 해결책을 설계할 예정이다.", "한국과 중국의 전문가들은 긴장 완화와 상호 신뢰를 위해 전략적 대화를 이어가야 한다고 강조했다. 참석자들은 한반도의 평화와 안정이 역내 협력에 중요한 조건이라는 데 의견을 모았다."];

lengthBank.ko.movie.long.push(...["비가 내린 밤의 현장에는 작은 흔적만 남아 있었다. 형사는 여러 사람의 기억이 서로 다르다는 사실을 깨닫고, 처음부터 사건을 다시 살펴보기로 한다.", "잠복근무를 위해 문을 연 가게는 예상과 달리 손님으로 가득 찼다. 형사들은 주문을 처리하면서도 서로 신호를 주고받고, 계획을 이어갈 방법을 찾아야 했다.", "자연의 소리를 녹음하던 두 사람은 함께한 시간이 길어지며 가까워졌다. 하지만 같은 장소를 다시 찾았을 때, 그들이 기억하는 장면과 바라는 미래는 조금씩 달라져 있었다.", "수사가 멈춘 듯한 순간, 오래된 기록 하나가 새로운 가능성을 보여 주었다. 형사는 익숙한 결론에 기대지 않고 주변의 작은 단서를 하나씩 확인하기 시작했다.", "식당이 바빠질수록 작전의 우선순위도 계속 바뀌었다. 팀원들은 웃음을 참으며 손님을 응대했지만, 중요한 순간마다 서로의 판단을 믿어야 했다.", "녹음기에 남은 바람과 파도 소리는 두 사람의 여행을 오래 기억하게 만들었다. 시간이 흐른 뒤 그 소리를 다시 들으면서 한 사람은 지나간 관계를 차분히 받아들였다.", "서로 다른 목격담을 비교하던 형사는 말보다 행동에 남은 차이를 주목했다. 사건의 실마리는 거창한 증거가 아니라 아무도 중요하게 여기지 않았던 사소한 장면에 있었다.", "가게 안에는 손님들의 웃음소리와 주문 소리가 끊이지 않았다. 형사들은 평범한 하루를 연기하면서도 정해진 순간이 오면 망설임 없이 본래의 임무로 돌아가야 했다.", "처음에는 같은 풍경을 즐기던 두 사람이 어느 순간부터 서로 다른 것을 바라보기 시작했다. 조용한 대화와 길어진 침묵 속에서 관계가 변했다는 사실이 서서히 드러났다.", "사건 현장을 다시 찾은 형사는 비가 흔적을 지웠다고 생각했다. 하지만 주변을 자세히 살펴보자 처음에는 지나쳤던 작은 물건이 새로운 질문을 만들어 냈다.", "팀원들은 예상보다 많은 손님과 갑작스러운 상황 변화에 지쳐 갔다. 그래도 각자의 역할을 나누고 서로를 믿으며, 불가능해 보였던 계획을 끝까지 이어 가기로 했다.", "예전에 함께 녹음했던 소리를 다시 들은 사람은 그날의 날씨와 대화를 떠올렸다. 소리는 그대로였지만 기억은 달라져 있었고, 그는 그 차이를 인정할 준비를 했다.", "진술이 엇갈리는 이유를 찾기 위해 형사는 시간과 장소를 표로 정리했다. 흩어진 정보가 한눈에 놓이자 사건을 바라보던 관점도 조금씩 바뀌기 시작했다.", "작전이 시작된 뒤에는 작은 실수도 전체 계획을 흔들 수 있었다. 팀원들은 농담으로 긴장을 풀면서도 각자의 신호와 순서를 다시 확인했다.", "두 사람은 함께 걷던 길을 다시 찾아갔지만, 예전과 똑같은 감정을 되살릴 수는 없었다. 남은 것은 풍경에 대한 기억과 서로에게 배운 것들이었다.", "형사는 마지막으로 현장을 확인하고서야 놓친 단서가 무엇인지 알아차렸다. 오랫동안 쫓던 답은 멀리 있지 않았고, 익숙함 때문에 보이지 않았을 뿐이었다.", "붐비는 가게는 수사팀에게 뜻밖의 기회를 제공했지만 새로운 부담도 안겼다. 형사들은 장사와 작전을 함께 이어 가며, 작은 변화에도 빠르게 대응해야 했다.", "시간이 흐른 뒤 한 사람은 오래된 녹음 파일을 정리하다가 익숙한 웃음소리를 발견했다. 그는 잠시 멈춰 서서 그때의 마음을 떠올린 뒤 파일을 조심스럽게 저장했다."]);

function effectiveTarget(text){
 if(!ignoreSpecial)return text;

}

const sentenceDecks = new Map();
function pickIndex(){
 const arr=getCurrentItems();
 const key=lang+'|'+mode+'|'+lengthMode;
 let deck=sentenceDecks.get(key);
 if(!deck||deck.length===0){
  deck=Array.from({length:arr.length},(_,i)=>i);
  // Do not repeat the current sentence at the beginning of a new cycle.
  if(current>=0&&deck.length>1)deck=deck.filter(i=>i!==current);
  for(let i=deck.length-1;i>0;i--){
   const j=Math.floor(Math.random()*(i+1));
   [deck[i],deck[j]]=[deck[j],deck[i]];
  }
 }
 current=deck.pop();
 sentenceDecks.set(key,deck);
 return current;
}
function renderGuide(val,target){

  if(i===length)break;
  const hasTyped=i<val.length;
  const ch=hasTyped?val[i]:target[i];
  const cls=hasTyped?(charMatches(val[i],target[i])?'typed-correct':'typed-wrong'):'untyped';
  html+='<span class="'+cls+'">'+escapeHtml(ch)+'</span>';
 }
 guide.innerHTML='<span class="typing-guide-content">'+(html||'<span class="custom-caret" aria-hidden="true"></span>')+'</span>';
}

 }
});
function finish(exact=false){if(done)return;done=true;clearInterval(interval);tick();$('typingInput').disabled=true;const val=$('typingInput').value,target=effectiveTarget(getCurrentItems()[current][0]);renderGuide(val,target);let correct=0;for(let i=0;i<Math.min(val.length,target.length);i++)if(charMatches(val[i],target[i]))correct++;const acc=val.length?Math.round(correct/val.length*100):0;const wpm=Math.round((val.length/5)/(Math.max(1,elapsed())/60));$('wpm').textContent=wpm;$('cpm').textContent=Math.round(val.length/(Math.max(1,Date.now()-startedAt)/60000));$('accuracy').textContent=acc;const finalProgress=Math.min(100,Math.round(val.length/target.length*100));$('progress').textContent=finalProgress+'%';$('statsProgressFill').style.width=finalProgress+'%';nextTimeout=setTimeout(()=>{loadQuote(true);$('typingInput').focus()},exact?120:650)}
function showToast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>$('toast').classList.remove('show'),2400)}

$('ignoreCaseBtn').addEventListener('click',()=>{
 ignoreCase=!ignoreCase;syncRuleButtons();loadQuote(false);$('typingInput').focus();
 showToast(ignoreCase?'대소문자 구분을 무시해.':'대소문자를 구분해.');
});
$('ignoreSpecialBtn').addEventListener('click',()=>{
 ignoreSpecial=!ignoreSpecial;syncRuleButtons();loadQuote(false);$('typingInput').focus();
 showToast(ignoreSpecial?'특수문자 입력을 생략해.':'특수문자 입력을 다시 적용해.');
});
document.querySelectorAll('.length-option').forEach(b=>b.addEventListener('click',()=>{
 lengthMode=b.dataset.length;
 document.querySelectorAll('.length-option').forEach(x=>x.classList.toggle('active',x.dataset.length===lengthMode));
 current=-1;loadQuote(true);
 showToast(({short:'단문 연습을 선택했어요.',long:'장문 연습을 선택했어요.',words:'단어 연습을 선택했어요.'}[lengthMode]));
 $('typingInput').focus();
}));
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));document.querySelectorAll('.lang').forEach(b=>b.addEventListener('click',()=>setLanguage(b.dataset.lang)));$('newBtn').addEventListener('click',()=>loadQuote(true));
$('themeBtn').addEventListener('click',()=>{document.body.classList.toggle('dark');const dark=document.body.classList.contains('dark');$('themeBtn').textContent=dark?'☀ Light':'☾ Dark';});

try {
 updateLanguageUI();syncRuleButtons();loadQuote(false);
} catch (error) {
 console.error('type.ai initialization failed:', error);
 const stage=document.getElementById('typingStage');
 if(stage) {
  stage.innerHTML='<div style="padding:24px;color:#ff9aa9;text-align:center;font:14px/1.7 sans-serif">페이지를 초기화하지 못했어요. 새로고침하거나 HTML 파일을 다시 열어 주세요.</div>';
 }
}
</script>
</body></html>
